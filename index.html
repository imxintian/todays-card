<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Card</title>
<style>
  :root { --ink:#1c1917; --muted:#57534e; --line:#e7e5e4; --accent:#0f766e; --wash:#f0fdfa; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font:16px/1.45 system-ui, sans-serif; color:var(--ink); background:#f4f1ea; }
  main { width:min(480px, 100%); }
  h1 { margin:0 0 4px; font-size:1.6rem; letter-spacing:-.02em; }
  .lead { margin:0 0 18px; color:var(--muted); }
  form, .results { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; }
  label { display:block; margin:12px 0 6px; font-size:.82rem; font-weight:650; }
  input, select, button { width:100%; font:inherit; border-radius:10px; }
  input, select { padding:10px 12px; border:1px solid #d6d3d1; background:#fff; }
  button { margin-top:16px; padding:11px; border:0; background:var(--accent); color:#fff; font-weight:650; cursor:pointer; }
  .results { margin-top:14px; display:grid; gap:8px; }
  .results[hidden] { display:none; }
  article { display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:12px; border:1px solid var(--line); border-radius:12px; }
  article.best { border-color:var(--accent); background:var(--wash); }
  .tag { color:var(--accent); font-size:.68rem; font-weight:750; letter-spacing:.06em; text-transform:uppercase; }
  .name { font-weight:650; }
  .rate { color:var(--muted); font-size:.85rem; }
  .cash { font-weight:750; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Today's Card</h1>
  <p class="lead">Enter a purchase. The card with the highest cashback is marked.</p>
  <form id="form">
    <label for="amount">Purchase amount</label>
    <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="42.50" required>
    <label for="category">Category</label>
    <select id="category" name="category">
      <option value="groceries">Groceries</option>
      <option value="gas">Gas</option>
      <option value="dining">Dining</option>
      <option value="travel">Travel</option>
      <option value="other">Everything else</option>
    </select>
    <button type="submit">Compare cards</button>
  </form>
  <section class="results" id="results" hidden></section>
</main>
<script>
const CARDS = [
  { name: "Plain 2%", rates: { groceries: 2, gas: 2, dining: 2, travel: 2, other: 2 } },
  { name: "Market Card", rates: { groceries: 4, gas: 3, dining: 1, travel: 1, other: 1 } },
  { name: "Out Card", rates: { groceries: 1, gas: 1, dining: 4, travel: 3, other: 1 } },
];
const form = document.getElementById("form");
const results = document.getElementById("results");

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const amount = Number(form.amount.value);
  const category = form.category.value;
  const rows = CARDS.map((card) => ({
    name: card.name,
    rate: card.rates[category],
    cash: amount * card.rates[category] / 100,
  }));
  const best = Math.max(...rows.map((row) => row.cash));
  results.hidden = false;
  results.innerHTML = rows.map((row) => {
    const win = row.cash === best;
    return `<article class="${win ? "best" : ""}">
      <div>${win ? '<div class="tag">Best today</div>' : ""}
        <div class="name">${row.name}</div>
        <div class="rate">${row.rate}% · $${row.cash.toFixed(2)} back</div></div>
      <div class="cash">${row.rate}%</div></article>`;
  }).join("");
});
</script>
</body>
</html>
